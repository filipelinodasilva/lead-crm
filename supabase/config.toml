# Configuração do Supabase CLI para rodar o wacrm LOCAL em Docker (teste).
# Portas 563xx para não conflitar com outros Supabase locais (54321-54324).
# Em produção (VPS) esta configuração não é usada: veja instalar.sh e docs/INSTALACAO.md.
project_id = "wacrm"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 56323

[inbucket]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3010"
additional_redirect_urls = ["http://localhost:3010/**", "http://127.0.0.1:3010/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
